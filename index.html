<script>

/* FECHA */
const activacion = new Date("2026-05-15T23:55:00");

const contenido = document.getElementById("contenido");
const intro = document.getElementById("intro");
const musica = document.getElementById("musica");

/* INTRO */
setTimeout(()=>{
  intro.style.display="none";
  contenido.style.display="block";
  iniciar();
},3000);

/* PANTALLA INICIAL */
function iniciar(){

  const ahora = new Date();

  if(ahora >= activacion){
    mostrarPregunta();
  }else{
    mostrarCuenta();
    actualizarContador();
    setInterval(actualizarContador,1000);
  }
}

/* CUENTA */
function mostrarCuenta(){

  contenido.innerHTML = `
    <div style="animation: aparecer 2s;">

      <p style="font-size:1.5rem;">💌 Lore…</p>

      <p style="
        font-size:1.2rem;
        max-width:700px;
        margin:auto;
        line-height:1.8;
        padding:10px;
      ">
        No sé si las coincidencias existen o si simplemente Diosito
        acomoda las cosas de formas inesperadas… ✨
        <br><br>

        Pero estoy seguro de que habernos cruzado en el camino
        pasó por algo muy bonito ❤️
        <br><br>

        Gracias por permitirme conocerte este tiempo,
        por cada risa, cada plática y cada momento
        que sin darte cuenta has hecho especial para mí 💖
        <br><br>

        Desde que llegaste, mis días se sienten distintos…
        y honestamente ya no imagino no hablar contigo ✨
        <br><br>

        Hay preguntas que merecen el momento perfecto…
      </p>

      <h2 id="contador" style="
        margin-top:30px;
        font-size:2rem;
      ">
      </h2>

      <p style="
        opacity:0.8;
        margin-top:10px;
      ">
        Falta muy poquito 💖
      </p>

    </div>
  `;
}

/* SOLO ACTUALIZA EL TEXTO */
function actualizarContador(){

  const ahora = new Date();
  const diff = activacion - ahora;

  if(diff <= 0){
    mostrarPregunta();
    return;
  }

  const h = Math.floor(diff / 1000 / 60 / 60);
  const m = Math.floor((diff / 1000 / 60) % 60);
  const s = Math.floor((diff / 1000) % 60);

  document.getElementById("contador").innerHTML =
    `${h}h ${m}m ${s}s ⏳`;
}

/* PREGUNTA */
function mostrarPregunta(){

  contenido.innerHTML = `
    <div style="animation: aparecer 2s;">

      <div class="nombre">Lore 💖</div>

      <p style="font-size:1.3rem;">
        Desde que llegaste… todo cambió ✨
      </p>

      <h1 style="font-size:2.8rem;">
        ¿Quieres ser mi novia? ❤️
      </h1>

      <button class="si" onclick="respuesta()">
        Sí 💖
      </button>

      <button class="obvio" onclick="respuesta()">
        Obvio sí 😍
      </button>

    </div>
  `;

  musica.play();
}

/* RESPUESTA */
function respuesta(){

  if(navigator.vibrate){
    navigator.vibrate([200,100,200,100,300]);
  }

  contenido.innerHTML = `
    <div style="animation: aparecer 2s;">

      <h1 style="font-size:3rem;">
        ❤️ Sabía que dirías que sí ❤️
      </h1>

      <p style="
        font-size:1.4rem;
        line-height:1.7;
      ">
        Prometo hacerte muy feliz 💖
        <br><br>
        Gracias por elegirnos ✨
      </p>

    </div>
  `;
}

/* CORAZONES */
function crearCorazones(){

  const contenedor =
    document.getElementById("corazones");

  for(let i=0;i<25;i++){

    const corazon =
      document.createElement("span");

    corazon.innerHTML = "❤️";

    corazon.style.left =
      Math.random()*100+"%";

    corazon.style.animationDuration =
      (5+Math.random()*5)+"s";

    corazon.style.fontSize =
      (15+Math.random()*20)+"px";

    contenedor.appendChild(corazon);
  }
}

crearCorazones();

</script>
